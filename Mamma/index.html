<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>맘마 - 생활 필수 앱</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Fonts: Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar overlay for mobile -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-brand">
                <span class="material-icons-round">home</span>
                <h2>맘마</h2>
            </div>
            
            <div class="sidebar-menu">
                <!-- Group: Mamma -->
                <div class="menu-group">
                    <div class="menu-group-header active" id="mamma-group-header">
                        <span class="material-icons-round">restaurant</span>
                        <span>맘마</span>
                        <span class="material-icons-round chevron">expand_more</span>
                    </div>
                    <div class="menu-sub-items" id="mamma-sub-items">
                        <button class="menu-item active" data-view="daily">
                            <span class="material-icons-round">calendar_today</span>
                            <span>일간 기록</span>
                        </button>
                        <button class="menu-item" data-view="recipe">
                            <span class="material-icons-round">menu_book</span>
                            <span>메뉴 관리</span>
                        </button>
                        <button class="menu-item" data-view="stats">
                            <span class="material-icons-round">insights</span>
                            <span>통계 & AI</span>
                        </button>
                        <button class="menu-item" data-view="shopping">
                            <span class="material-icons-round">shopping_cart</span>
                            <span>장보기</span>
                        </button>
                    </div>
                </div>
                
                <!-- Mini Dining -->
                <button class="menu-item" data-view="dining">
                    <span class="material-icons-round">local_dining</span>
                    <span>미니다이닝</span>
                </button>

                <!-- Shopping Cart -->
                <button class="menu-item" data-view="cart">
                    <span class="material-icons-round">local_mall</span>
                    <span>쇼핑카트</span>
                </button>
                
                <!-- Fishing Record -->
                <button class="menu-item" data-view="fishing">
                    <span class="material-icons-round">phishing</span>
                    <span>낚시기록</span>
                </button>
            </div>
            
            <!-- Sidebar Footer: Version & Release Notes -->
            <div class="sidebar-footer" style="padding: 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center;">
                <button id="version-btn" style="background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; transition: background-color 0.2s;">
                    <span class="material-icons-round" style="font-size: 14px;">info</span>
                    <span>Mamma v2.4.0 (업데이트 내역)</span>
                </button>
            </div>
        </aside>

        <!-- Header -->
        <header id="main-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button id="sidebar-toggle" class="icon-btn"><span class="material-icons-round">menu</span></button>
                <h1 id="header-title">맘마</h1>
            </div>
            <div style="display:flex; gap:10px;">
                <span id="sync-status" class="material-icons-round" style="color:var(--text-secondary); display:none; align-items:center; font-size:18px;">cloud_off</span>
                <button id="header-action" class="icon-btn" style="display: none;"><span class="material-icons-round">add</span></button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Views will be injected here (Daily, Recipe, Stats, Shopping, Cart, Fishing) -->
        </main>
    </div>
    
    <!-- Modals -->
    <div id="modal-container" class="hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content" id="modal-body"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/version.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/store.js"></script>
    <script type="module" src="js/ai.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/app.js"></script>
    
    <!-- Service Worker Registration & Seamless Auto-Update -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('ServiceWorker registered');
                    
                    // Periodically check for updates
                    reg.update();

                    // Check for updates when user switches back to the app
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            reg.update();
                        }
                    });

                    // Listen for incoming new version
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('New update available.');
                                if (window.UI && window.UI.showUpdateBanner) {
                                    window.UI.showUpdateBanner();
                                }
                            }
                        });
                    });
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });

                // Auto-refresh when new service worker takes control
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>
</body>
</html>
